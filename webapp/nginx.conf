# Standalone frontend (web/dist) server for RAGFlow, python backend scheme.
# Mount this file as /etc/nginx/conf.d/default.conf and mount the built
# web/dist at /usr/share/nginx/html.
#
# Backend: python scheme on 172.168.2.30
#   - main API (/api, /v1)        -> 9380
#   - admin API (/api/v1/admin)   -> 9381  (only if backend started with --enable-adminserver)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain application/javascript text/css application/json application/xml image/svg+xml;
    client_max_body_size 1024m;   # knowledge-base file uploads

    # Admin API
    location ~ ^/api/v1/admin {
        proxy_pass http://127.0.0.1:9381;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Main Python API: /api and /v1
    location ~ ^/(v1|api) {
        proxy_pass http://127.0.0.1:9380;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA entry / fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache static assets emitted by the Vite build
    location ~ ^/static/(css|js|media)/ {
        expires 10y;
        access_log off;
    }
}
