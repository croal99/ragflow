name: ragflow

include:
  - ./docker-compose-base.yml
# To ensure that the container processes the locally modified `service_conf.yaml.template` instead of the one included in its image, you need to mount the local `service_conf.yaml.template` to the container.
# The web UI is served by the separate `web` service below from a locally compiled
# `web/dist` (built with `cd ../web && npm install && npm run build`), instead of the
# copy baked into RAGFLOW_IMAGE. The `ragflow-cpu` container only runs the Go backend
# (API on 9380 / Admin on 9381); its in-image nginx is no longer published to the host.
services:

  ragflow-cpu:
    depends_on:
      mysql:
        condition: service_healthy
        required: false
    profiles:
      - cpu
    image: ${RAGFLOW_IMAGE}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
      nproc:
        soft: 65535
        hard: 65535
    # MCP is served in-process by the API server (POST /mcp on the 9380 port).

    # Example configuration to start Admin server:
    command:
      - --enable-adminserver
      - --init-superuser
    #- --init-model-provider-tables
    # Only the Go API/Admin ports are published; the web UI is served by the `web` service.
    ports:
      - ${SVR_HTTP_PORT}:9380
      - ${ADMIN_SVR_HTTP_PORT}:9381
    volumes:
      - ./ragflow-logs:/ragflow/logs
      # - ./nginx/ragflow.conf:/etc/nginx/conf.d/ragflow.conf
      # - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      # - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./service_conf.yaml.template:/ragflow/conf/service_conf.yaml.template
      - ./entrypoint.sh:/ragflow/entrypoint.sh
      # - ${RAGFLOW_SSH_KNOWN_HOSTS:-${HOME}/.ssh/known_hosts}:${SSH_KNOWN_HOSTS:-/etc/ragflow/ssh_known_hosts}:ro
    env_file: .env
    # Route the Go services' cache/queue backend to the separate Kvrocks service.
    # The Python services use the Valkey `redis` service, which the Go deployment
    # disables (see the `redis` profile override above). KVROCKS_HOST/KVROCKS_PORT
    # are the IN-NETWORK coordinates the Go process uses to reach `kvrocks:6379`; the
    # host-published port is KVROCKS_PORT (see docker-compose-base.yml), which CI
    # offsets per job and keeps distinct from REDIS_PORT.
    environment:
      - KVROCKS_HOST=kvrocks
      - KVROCKS_PORT=6379
    networks:
      - ragflow
    restart: unless-stopped
    # https://docs.docker.com/engine/daemon/prometheus/#create-a-prometheus-configuration
    # If you use Docker Desktop, the --add-host flag is optional. This flag ensures that the host's internal IP is exposed to the Prometheus container.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Standalone web UI: serves a locally compiled `web/dist` via nginx:alpine,
  # proxying /api, /v1 and /api/v1/admin to the Go backend in `ragflow-cpu`.
  # Pattern参考 webapp/docker-compose.yml (nginx:alpine + 挂载 dist + nginx.conf).
  web:
    image: nginx:alpine
    container_name: ragflow-web
    profiles:
      - cpu
    depends_on:
      ragflow-cpu:
        condition: service_started
    ports:
      - ${SVR_WEB_HTTP_PORT}:80
      # HTTPS (443) is omitted here; add cert mounts + a TLS server block in
      # ./nginx/web-standalone.conf if you need HTTPS.
    volumes:
      # 本地编译产物：先在 ../web 下 `npm install && npm run build`，
      # 再把生成的 web/dist 整个目录拷到本目录下的 ./web-dist/（保持 docker/ 自包含，便于整体发布）。
      - ./web-dist:/usr/share/nginx/html:ro
      - ./nginx/web-standalone.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ragflow
    restart: unless-stopped
