# Standalone frontend (web/dist) server for RAGFlow, Go backend scheme.
# Mount this file as /etc/nginx/conf.d/default.conf and mount the built
# web/dist at /usr/share/nginx/html.
#
# Backend: Go services running in the `ragflow-cpu` container (same `ragflow`
# docker network). The prebuilt in-image nginx in ragflow-cpu is no longer
# published to the host; this container is the only web entrypoint.
#   - admin API (/api/v1/admin)   -> ragflow-cpu:9381  (needs --enable-adminserver)
#   - main API  (/api, /v1)       -> ragflow-cpu:9380

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain application/javascript text/css application/json application/xml image/svg+xml;
    client_max_body_size 1024m;   # knowledge-base file uploads

    # Admin API (must precede the broad /api rule)
    location ~ ^/api/v1/admin {
        proxy_pass http://ragflow-cpu:9381;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Main Go API: /api and /v1
    location ~ ^/(v1|api) {
        proxy_pass http://ragflow-cpu:9380;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA entry / fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache static assets emitted by the Vite build
    location ~ ^/static/(css|js|media)/ {
        expires 10y;
        access_log off;
    }
}
